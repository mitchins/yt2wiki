# Portainer stack — one required yt2wiki service, one EXPERIMENTAL llama.cpp sidecar.
# Deploy as a Portainer "Stack" with environment variables and bind mounts.
#
# IMAGE HONESTY: `yt2wiki:0.1.0` is NOT a public image — no registry copy has
# been published or verified. Build it on the Docker endpoint first, then
# deploy this stack against the local image:
#   docker build -t yt2wiki:0.1.0 .
#   docker images yt2wiki:0.1.0
# (Alternative: push your build to a private registry and change `image:`
# below to that exact reference. Do not invent a public tag.)
#
# For a migration-free install of an existing library, replace the named volume with a bind mount:
#   volumes:
#     - /home/mitch/.local/share/yt2wiki:/data
# See docker-compose.yml for the buildable development stack.

services:
  yt2wiki:
    image: yt2wiki:0.1.0   # local build required (see above); not a public registry image
    container_name: yt2wiki
    ports:
      - "127.0.0.1:8080:8000"   # bind to host loopback; put an authenticated proxy in front for LAN
    volumes:
      - yt2wiki-data:/data
    environment:
      - YT2WIKI_HOME=/data
      - YT2WIKI_PROFILE=${YT2WIKI_PROFILE:-compact}
      - HF_HOME=/data/models
      # External provider keys: define these names in the Portainer stack
      # "Environment variables" / "Advanced mode" UI (or a Portainer secret
      # mounted as env), NOT hardcoded here. Stack-variable mapping:
      #   YT2WIKI_OPENAI_API_KEY=${YT2WIKI_OPENAI_API_KEY:-}
      #   YT2WIKI_GEMMA_API_KEY=${YT2WIKI_GEMMA_API_KEY:-}
      # `${VAR}` is interpolated by Portainer/Compose at deploy time from the
      # stack variables you set; the container then receives the resolved value
      # as its environment. inference.json stores only the variable NAME.
      - YT2WIKI_OPENAI_API_KEY=${YT2WIKI_OPENAI_API_KEY:-}
      - YT2WIKI_GEMMA_API_KEY=${YT2WIKI_GEMMA_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # EXPERIMENTAL sidecar: NOT qualified (no weights, no digest verified, no
  # 8-image validation performed). Deploy only to attempt your own qualification.
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda   # pin after pull: @sha256:<verified digest>
    container_name: yt2wiki-llama
    profiles: ["llama"]
    volumes:
      - yt2wiki-models:/models
      - yt2wiki-data:/data:ro
    command:
      - --model
      - /models/Qwen3.5-4B-Q4_K_M.gguf
      - --mmproj
      - /models/mmproj-F16.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --ctx-size
      - "16384"
      - --n-gpu-layers
      - "99"
      - --reasoning
      - "off"
      - --reasoning-budget
      - "0"
      - --temp
      - "0.05"
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  yt2wiki-data:
    name: yt2wiki-data
  yt2wiki-models:
    name: yt2wiki-models
