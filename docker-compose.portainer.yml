# Portainer stack — same prebuilt GHCR image as docker-compose.yml.
# Deploy by pasting docker-compose.yml (preferred) or this file as the
# stack content; both pull ghcr.io/mitchins/yt2wiki and need no build step.
#
# For a migration-free install of an existing library, replace the named volume with a bind mount:
#   volumes:
#     - /home/mitchins/.local/share/yt2wiki:/data
# Pinned deployments: set the stack variable YT2WIKI_IMAGE_TAG to
# vX.Y.Z or sha-<commit> (no leading colon). See docs/releases.md.

services:
  yt2wiki:
    image: ghcr.io/mitchins/yt2wiki:${YT2WIKI_IMAGE_TAG:-main}
    container_name: yt2wiki
    ports:
      - "127.0.0.1:8080:8000"   # bind to host loopback; put an authenticated proxy in front for LAN
    volumes:
      - yt2wiki-data:/data
    env_file:
      - path: .env
        required: false
    environment:
      - YT2WIKI_HOME=/data
      - YT2WIKI_PROFILE=${YT2WIKI_PROFILE:-compact}
      - HF_HOME=/data/models
      # OCI digest of the running image for generation manifests
      # (set when deploying a pinned :sha-<commit> tag).
      - YT2WIKI_IMAGE_DIGEST=${YT2WIKI_IMAGE_DIGEST:-}
      # External provider keys: define these names in the Portainer stack
      # "Environment variables" / "Advanced mode" UI, NOT hardcoded here.
      # (Portainer/Docker secrets mount as files, which this service does not
      # read — stack variables are the supported input.) inference.json
      # stores only the variable NAME, never a key value.
      - YT2WIKI_OPENAI_API_KEY=${YT2WIKI_OPENAI_API_KEY:-}
      - YT2WIKI_GEMMA_API_KEY=${YT2WIKI_GEMMA_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # EXPERIMENTAL sidecar: NOT qualified (no weights, no digest verified, no
  # 8-image validation performed against a running server). Deploy only to
  # attempt your own qualification. Disabled by default (profiles are only
  # started explicitly).
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda   # pin after pull: @sha256:<verified digest>
    container_name: yt2wiki-llama
    profiles: ["llama"]
    volumes:
      - yt2wiki-models:/models
      - yt2wiki-data:/data:ro
    command:
      - --model
      - /models/Qwen3.5-4B-Q4_K_M.gguf
      - --mmproj
      - /models/mmproj-F16.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --ctx-size
      - "16384"
      - --n-gpu-layers
      - "99"
      - --reasoning
      - "off"
      - --reasoning-budget
      - "0"
      - --temp
      - "0.05"
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  yt2wiki-data:
    name: yt2wiki-data
  yt2wiki-models:
    name: yt2wiki-models
