services:
  yt2wiki:
    # Canonical install: prebuilt multi-arch image from GHCR. No local build.
    #   docker compose pull && docker compose up -d
    # Pin a release with YT2WIKI_IMAGE_TAG=:vX.Y.Z or an immutable build with
    # YT2WIKI_IMAGE_TAG=:sha-<commit> (see docs/releases.md).
    image: ghcr.io/mitchins/yt2wiki:${YT2WIKI_IMAGE_TAG:-main}
    # Developer-only local build path (never used for ordinary installs):
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml build
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d
    container_name: yt2wiki
    # Bind to host loopback only. LAN access goes through an authenticated
    # reverse proxy (see docs/deploy.md): either a host proxy with this
    # loopback binding kept, or a container proxy on an isolated internal
    # network with no published application port. Never publish 0.0.0.0:8080:
    # that exposes the unauthenticated UI around the proxy.
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - yt2wiki-data:/data                 # SQLite, uploads, frames, articles, assets, revisions, config
      # For migration-free reuse of an existing library, replace the named volume with a bind mount:
      # - /home/mitch/.local/share/yt2wiki:/data
    # Secret injection: provider keys enter the container from an untracked
    # env_file (Compose interpolation ${VAR} happens on the host; env_file
    # entries become container environment). Never commit .env; chmod 600.
    # Copy .env.example to .env and fill in values on the Docker endpoint.
    env_file:
      - path: .env
        required: false
    environment:
      # All settings are env-driven; secrets via YT2WIKI_ env names, not hardcoded.
      - YT2WIKI_HOME=/data
      # OCI digest of the running image when the operator pins one
      # (YT2WIKI_IMAGE_TAG=:sha-...); recorded in generation manifests.
      - YT2WIKI_IMAGE_DIGEST=${YT2WIKI_IMAGE_DIGEST:-}
      # Optional: choose profile (compact fits 8 GB, standard 12–16 GB). Default is standard.
      - YT2WIKI_PROFILE=compact
      # Default transcription backend: the pinned Whisper service below
      # (enable with: docker compose --profile asr up -d). Without it,
      # transcription jobs fail loudly — assign the transcription role to a
      # provider in Settings → Inference, or set YT2WIKI_ASR_MODEL to declare
      # the server-side model for provenance (see docs/deploy.md).
      - YT2WIKI_ASR_URL=http://asr:9000
      # Logging / cache inside container
      - HF_HOME=/data/models
    restart: unless-stopped
    # Health and bounded logs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No GPU reservation — the web service never needs NVIDIA to start or serve the library.
    # It serves the library and fails jobs explicitly when inference is offline.

  # Default transcription backend: maintained Whisper HTTP service.
  # Qualified for P3 (digest-pinned, large-v3, word timestamps verified).
  # Enable with: docker compose --profile asr up -d
  # Private by design: no published ports — reachable only as http://asr:9000
  # from the yt2wiki service on this network. Model weights live in the
  # persistent asr-models volume; yt2wiki itself ships no ASR runtime.
  asr:
    # ahmetoner/whisper-asr-webservice 1.x GPU build (faster-whisper engine),
    # verified 2026-10-23 via `docker inspect` on the qualification machine.
    # NOTE: the :latest (CPU) tag is a different image; this digest is the
    # -gpu build. Re-verify after any pull.
    image: onerahmet/openai-whisper-asr-webservice@sha256:3deb30cfd3d5614fd3885e6dfbef7dfcf95fe897300ecc703f7f3b3682b717ae
    container_name: yt2wiki-asr
    profiles: ["asr"]
    volumes:
      - asr-models:/root/.cache   # persistent HF/model cache (no re-download)
    environment:
      - ASR_MODEL=large-v3        # server-side model (declare the same in YT2WIKI_ASR_MODEL)
      - ASR_ENGINE=faster_whisper
      - ASR_DEVICE=cuda           # GPU build below; for CPU hosts use the -cpu
        # image tag AND delete the deploy.reservations block (a GPU
        # reservation prevents startup where no NVIDIA device exists).
    # GPU selection: `count: 1` takes the first visible card. On multi-GPU
    # hosts pin the card explicitly, e.g. `device_ids: ['2']`
    # (a bare 8 GB card OOMs on large-v3; the qualification machine needed
    # device 2, a 12 GB card, for the pinned weights).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/docs')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # EXPERIMENTAL visual sidecar: NOT qualified. The referenced weights
  # (Qwen3.5-4B Q4_K_M + F16 projector) are absent from this machine, no
  # 8-image ranking, CUDA-offload or V9 rubric validation has been performed
  # against a running server, and no digest is claimed below. Do not represent
  # this profile as production-ready. The yt2wiki service above is independently
  # usable without it.
  # Enable (experimental) with: docker compose --profile llama up -d
  llama:
    # Upstream CUDA server build (ggml-org took over from the deprecated
    # ggerganov account). No digest is pinned here because none was verified
    # on this machine; pin one on your endpoint after `docker pull`:
    #   docker pull ghcr.io/ggml-org/llama.cpp:server-cuda
    #   docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/ggml-org/llama.cpp:server-cuda
    # Then replace `image:` with the digest form, e.g.:
    #   image: ghcr.io/ggml-org/llama.cpp@sha256:<verified digest>
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: yt2wiki-llama
    profiles: ["llama"]
    volumes:
      - yt2wiki-models:/models    # persistent GGUF directory, also usable via YT2WIKI_HOME/models
      - yt2wiki-data:/data:ro     # sidecar does not need write to library
    # Models must be staged beforehand under /models; the base service never auto-downloads large weights.
    # Expected files (UNQUALIFIED — stage only to attempt your own qualification):
    #   /models/Qwen3.5-4B-Q4_K_M.gguf
    #   /models/mmproj-F16.gguf   (or gguf/mmproj-F16.gguf per HF layout)
    # Flag meanings follow upstream llama.cpp docs; they were NOT validated
    # against a running server here. Qualify before any production claim:
    # real weights + matching F16 projector, confirmed CUDA offload, an actual
    # 8-image ranking inside the V9 context budget with valid rubric JSON, and
    # measured peak VRAM/latency over the Compose network.
    command:
      - --model
      - /models/Qwen3.5-4B-Q4_K_M.gguf
      - --mmproj
      - /models/mmproj-F16.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --ctx-size
      - "16384"
      - --n-gpu-layers
      - "99"
      - --reasoning
      - "off"
      - --reasoning-budget
      - "0"
      # Production image-token budget (V9-Z4 384); 8-image ranking must fit in 16384.
      # Adjust via env if needed.
      - --temp
      - "0.05"
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  yt2wiki-data:
    name: yt2wiki-data
  yt2wiki-models:
    name: yt2wiki-models
  asr-models:
    name: yt2wiki-asr-models

networks:
  default:
    name: yt2wiki
