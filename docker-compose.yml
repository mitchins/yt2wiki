# yt2wiki local deployment.
#
#   docker compose up --build
#
# The service keeps one worker with exclusive access to the GPU: stages run
# sequentially and each model is unloaded before the next one loads, so a 16 GB
# card never has to hold two substantial models at once.

services:
  yt2wiki:
    build:
      context: .
      dockerfile: Dockerfile
    image: yt2wiki:local
    container_name: yt2wiki
    restart: unless-stopped
    ports:
      - "${YT2WIKI_PORT:-8080}:8080"
    environment:
      # Profile selects the models in config/models.yaml.  Change this (or pass
      # YT2WIKI_PROFILE=compact) to run on an 8 GB card.
      YT2WIKI_PROFILE: "${YT2WIKI_PROFILE:-standard}"
      YT2WIKI_HOME: /data
      HF_HOME: /data/models
      # Pick a specific GPU by index; unset lets yt2wiki take the emptiest one.
      YT2WIKI_CUDA_DEVICE: "${YT2WIKI_CUDA_DEVICE:-}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      TZ: "${TZ:-UTC}"
    volumes:
      # Persistent library: database, media, frames, articles and model weights.
      - ${YT2WIKI_DATA_DIR:-./data}:/data
    # Exclusive access: one container, one model set, no contention.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Optional: batch CLI wrapper for headless reprocessing.
  #   docker compose --profile tools run --rm yt2wiki-cli run <url-or-source-id>
  yt2wiki-cli:
    image: yt2wiki:local
    profiles: ["tools"]
    environment:
      YT2WIKI_PROFILE: "${YT2WIKI_PROFILE:-standard}"
      YT2WIKI_HOME: /data
      HF_HOME: /data/models
      YT2WIKI_CUDA_DEVICE: "${YT2WIKI_CUDA_DEVICE:-}"
    volumes:
      - ${YT2WIKI_DATA_DIR:-./data}:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint: ["/usr/local/bin/yt2wiki-entrypoint"]
    command: ["--help"]
