[project]
name = "yt2wiki"
version = "0.1.0"
description = "Local, evidence-grounded compiler that turns a YouTube video into an illustrated wiki-style technical article."
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]

dependencies = [
    "yt-dlp>=2025.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "numpy>=1.26,<3",
    "tqdm>=4.66",
    "psutil>=5.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pytesseract>=0.3",  # OCR-density veto in the V9 judge (needs the tesseract binary)
]

[project.optional-dependencies]
# Local transcription runtime (CTranslate2 Whisper). The default install
# has NO local ASR: transcription goes over HTTP to a separately operated
# Whisper service. Install this extra only to run bundled faster-whisper
# explicitly (never an implicit fallback).
asr-local = [
    "faster-whisper>=1.1",
]
gpu = [
    "torch>=2.7",
    "transformers>=4.57",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "sentencepiece>=0.2",
    "safetensors>=0.4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "ruff>=0.6",
    # Gateway-peer tests construct TestClient(app, client=(host, port)), which
    # requires Starlette >= 0.44 (older TestClient has no `client` parameter).
    "starlette>=0.44",
]

[project.scripts]
yt2wiki = "yt2wiki.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["yt2wiki*"]

[tool.setuptools.package-data]
yt2wiki = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
markers = [
    "slow: requires real model weights / GPU",
    "network: requires internet access",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "B905", "SIM105", "SIM102"]
