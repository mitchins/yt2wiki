sonar.projectKey=mitchins_yt2wiki
sonar.organization=mitchins
sonar.sources=src/yt2wiki
sonar.tests=tests
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
sonar.python.coverage.reportPaths=coverage.xml
sonar.projectVersion=0.1.0
# Coverage is measured by pytest (Python only): this project has no JS test
# runner in CI, so browser glue under web/static cannot report coverage.
# Those files stay in analysis (bugs, vulnerabilities, duplications, style);
# their behavior is verified through the Python integration tests, which drive
# the same endpoints, plus live browser verification on the deployment.
sonar.coverage.exclusions=src/yt2wiki/web/static/**
